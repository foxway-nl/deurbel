<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen — Foxway Deurbel Beheer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0B0F19',
                            800: '#111827',
                            700: '#1F2937',
                            600: '#374151'
                        },
                        emerald: {
                            500: '#10B981',
                            600: '#059669'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-dark-800 border border-dark-700 rounded-2xl shadow-2xl p-8 backdrop-blur-lg">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center mb-4 shadow-inner">
                <svg class="w-9 h-9 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5z"/>
                    <path d="M12 9a2.5 2.5 0 0 0-2.5 2.5v1.8l-.7.7a.5.5 0 0 0 .35.8h5.7a.5.5 0 0 0 .35-.8l-.7-.7v-1.8A2.5 2.5 0 0 0 12 9z"/>
                    <path d="M11 16.5a1 1 0 0 0 2 0"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Foxway Deurbel</h1>
            <p class="text-sm text-gray-400 mt-1">Beheersysteem v3.7.0</p>
        </div>

        <form action="/admin/login" method="POST" class="space-y-5">
            {% if error %}
            <div class="p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-center gap-3">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" for="username">Gebruikersnaam</label>
                <input type="text" id="username" name="username" value="admin" required
                    class="w-full px-4 py-3 rounded-xl bg-dark-900 border border-dark-700 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-150">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2" for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" required autofocus placeholder="Voer wachtwoord in"
                    class="w-full px-4 py-3 rounded-xl bg-dark-900 border border-dark-700 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-150">
            </div>

            <button type="submit"
                class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-lg shadow-emerald-600/20 transition duration-150 flex items-center justify-center gap-2">
                <span>Inloggen</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-gray-500 border-t border-dark-700 pt-5">
            Foxway Smart Doorbell &bull; Lokale & 5G Beheerconsole
        </div>
    </div>
</body>
</html>
